# binddel=,XF86AudioLowerVolume,Lower volume 󰝞 ,exec,"/nix/store/sn0svfp87r2j1icnvrv6mwn6xbv2x4z0-wireplumber-0.5.14/bin/wpctl}" set-volume @DEFAULT_AUDIO_SINK@ 5%-
# binddl=,XF86AudioMute,Toggle mute 󰝟 ,exec,"/nix/store/sn0svfp87r2j1icnvrv6mwn6xbv2x4z0-wireplumber-0.5.14/bin/wpctl}" set-mute @DEFAULT_AUDIO_SINK@ toggle

# ---- audio mic bindings ---- #
