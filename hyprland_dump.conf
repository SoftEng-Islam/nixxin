binde = , XF86MonBrightnessUp, exec, brightnessctl s +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# ------------------------- #
# ---- Mouse Shortcuts ---- #
# ------------------------- #
# Scroll through monitor workspaces with mod + scroll
bind = $main, mouse_down, workspace, r-1
bind = $main, mouse_up, workspace, r+1
bind = $main, mouse:274, killactive, # $main + `Click On Mouse Scroll Button` to kill window
bindm = $main, mouse:272, movewindow # $main + `Left` Click
bindm = $main, mouse:273, resizewindow # $main + `Right` Click

# ---- Screen Snip ---- #
bind = Ctrl, Print, exec, grim -g "$(slurp)" - | swappy -f - # Screen snip >> edit
bind = $main SHIFT, S, exec, mkdir -p ~/Pictures/Area && /nix/store/ns16rpacgk9bnv6h5avmisbpxv7yk9gh-grimblast-0.1-unstable-2026-03-28/bin/grimblast --notify --freeze copysave area ~/Pictures/Area/AreaShot_"$(date '+%Y-%m-%d_%H.%M.%S')".png # Screen snip

# ---- Full Screenshot ---- #
bindl= , print, exec, /nix/store/ns16rpacgk9bnv6h5avmisbpxv7yk9gh-grimblast-0.1-unstable-2026-03-28/bin/grimblast --notify --freeze --wait 1 copysave screen ~/Pictures/Screenshots/$(date +%Y-%m-%dT%H%M%S).png

