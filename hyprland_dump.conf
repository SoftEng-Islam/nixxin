# PC Resources monitor.
bind = $main, R, exec, /nix/store/idvviswcdfx2196s4wnkvgfzrkah4n7s-mission-center-1.1.0/bin/missioncenter

bind = $main, T, exec, /nix/store/4ny85717cr4n0bngj8v02fx7gf91m6lh-wezterm-0-unstable-2026-03-31/bin/wezterm # Launch (terminal)
# bind = $main, Y, exec,
# bind = $main, U, exec,
# bind = $main, I, exec,
bind = $main, O, togglesplit

#=> Second Row:
bind = $main, A, exec, $ipc panel-toggle launcher # Launch Launcher
# bind = $main, S, exec,
# bind = $main, D, exec,
bind = $main, F, fullscreen,
#bind = $main Ctrl, F, 1, fullscreen 0
#bind = $main Ctrl, F, 2, fullscreen 1
#bind = $main Ctrl, F, 3, fullscreen 2
# bind = $main, G, exec,
# bind = $main, H, exec,
# bind = $main, J, exec,
# bind = $main, K, exec,
bind = $main, L, exec, $ipc screen-lock # Lock screen

#=> Third Row:
# bind = $main, Z, exec,
bind = $main, X, exec, /nix/store/zxaph6qipc38w6scymfyw7dg896ss3a2-zed-editor-1.3.6/bin/zeditor # Launch Zed Text Editor
bind = $main, C, exec, code # Launch VSCode (editor)
# bind = $main, V, exec,
# bind = $main, B, exec,
# bind = $main, N, exec,
# bind = $main, M, exec,

# ---------------------- #
# ---- $main + Ctrl ---- #
# ---------------------- #
bind = $main Ctrl, K, exec, hyprctl kill # Pick and kill an Active Window
bind = $main Ctrl, L, exec, hyprctl dispatch exit # Logout
bind = $main Ctrl, P, exec, /nix/store/wbjbqy79xxcrm7nvm932nk1rhkcvwhja-pavucontrol-6.2/bin/pavucontrol # Launch pavucontrol (volume mixer)
bind = $main Ctrl, R, exec, hyprctl reload && rm -rf ~/.cache/thumbnails/* && nautilus -q

# --------------------- #
# ---- $main + Alt ---- #
# --------------------- #

# ----------------------- #
# ---- $main + Shift ---- #
# ----------------------- #

# ----------------------- #
# ---- $main + F1:F12
# ----------------------- #
bind = $main, F1, exec, sudo toggleInternet
bind = $main, F2, exec, run-gamemode
bind = $main, F3, exec, run-blue-filter
bind = $main, F4, exec, $ipc panel-toggle session
bind = $main, F5, exec, waydroid session stop && notify-send "Waydroid Is Closed."
# bind = $main, F6, exec,

# --------------------- #
# ---- $main + Tag ---- #
# --------------------- #
#=> Launch Gnome Control Center
