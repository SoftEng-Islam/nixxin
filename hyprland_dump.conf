exec-once = /nix/store/xr9mx11i6gary2gbxnkfbxrdd0nfi4bx-dbus-1.16.2/bin/dbus-update-activation-environment --systemd --all && systemctl --user stop hyprland-session.target && systemctl --user start hyprland-session.target
exec-once=hyprctl plugin load /nix/store/8mfbd26ryvn8wvklqvyqb6q0xfwgjw42-hyprbars-0.55.0/lib/libhyprbars.so
$ipc=noctalia msg
$main=SUPER
$primary=rgba(d9263bff)
$surface=rgba(1e1e1eff)
animations {
  bezier=default,0.12,0.92,0.08,1.0
  bezier=wind,0.12,0.92,0.08,1.0
  bezier=overshot,0.18,0.95,0.22,1.03
  bezier=liner,1,1,1,1
  bezier=almostLinear,0.5,0.5,0.75,1.0
  bezier=easeOutQuint,0.23,1,0.32,1
  bezier=easeOutBack,0.25,1.5,0.5,1
  bezier=quick,0.15,0,0.1,1
  bezier=slidePop,0.25,1.2,0.35,1.05
  animation=global, 1, 12, default
  animation=border, 1, 6.0, easeOutQuint
  animation=windows, 1, 5, wind, popin 60%
  animation=windowsIn, 1, 6, overshot, popin 60%
  animation=windowsOut, 1, 4, overshot, popin 60%
  animation=windowsMove, 1, 4, overshot, slide
  animation=fadeIn, 1, 1.5, slidePop
  animation=fadeOut, 1, 1.2, slidePop
  animation=fade, 1, 3.5, quick
  animation=layers, 1, 4.0, easeOutQuint
  animation=layersIn, 1, 4.2, easeOutQuint
  animation=layersOut, 1, 1.8, easeOutQuint
  animation=fadeLayersIn, 1, 2.0, almostLinear
  animation=fadeLayersOut, 1, 1.6, almostLinear
  animation=workspaces, 1, 2.2, easeOutQuint
  animation=workspacesIn, 1, 1.5, easeOutQuint
  animation=workspacesOut, 1, 2.2, easeOutQuint
  enabled=true
}

binds {
  allow_workspace_cycles=true
  pass_mouse_when_bound=false
  workspace_back_and_forth=false
}

cursor {
  enable_hyprcursor=false
  inactive_timeout=2
  no_hardware_cursors=false
  no_warps=true
  warp_on_change_workspace=true
}

debug {
  disable_logs=false
  enable_stdout_logs=false
  gl_debugging=true
}

decoration {
  blur {
    brightness=0.500000
    contrast=0.500000
    enabled=true
    ignore_opacity=true
    new_optimizations=true
    noise=0.000000
    passes=1
    popups=true
    popups_ignorealpha=0.600000
    size=3
    special=true
    xray=true
  }

  shadow {
    color=rgba(00000070)
    enabled=true
    ignore_window=true
    offset=0 2
    range=15
    render_power=2
  }
  dim_inactive=true
  dim_special=0
  dim_strength=0.200000
  rounding=15
}

dwindle {
  force_split=1
  preserve_split=true
  pseudotile=true
  smart_resizing=true
  smart_split=true
  special_scale_factor=1
}


general {
  snap {
    enabled=true
  }
  allow_tearing=true
  border_size=4
  col.active_border=$primary
  col.inactive_border=rgba(6c6c6cff)
  extend_border_grab_area=0
  gaps_in=15
  gaps_out=30
  gaps_workspaces=15
  hover_icon_on_border=true
  layout=dwindle
  no_focus_fallback=true
  resize_on_border=true
}

gestures {
}

input {
  tablet {
  }

  touchdevice {
  }

  touchpad {
    clickfinger_behavior=true
    disable_while_typing=true
    drag_lock=false
    middle_button_emulation=true
    natural_scroll=yes
    scroll_factor=0.500000
    tap-to-click=true
  }
  accel_profile=flat
  float_switch_override_focus=0
  follow_mouse=1
  kb_layout=us,eg
  kb_model=
  kb_options=grp:alt_shift_toggle
  kb_rules=
  kb_variant=
  left_handed=false
  mouse_refocus=false
  repeat_delay=250
  repeat_rate=30
  scroll_factor=1.000000
  sensitivity=-0.500000
}

master {
  drop_at_cursor=true
  mfact=0.500000
  new_on_active=true
  new_on_top=1
  new_status=master
  smart_resizing=true
}

misc {
  allow_session_lock_restore=true
  animate_manual_resizes=true
  animate_mouse_windowdragging=false
  background_color=rgb(000000)
  disable_autoreload=true
  disable_hyprland_logo=true
  disable_splash_rendering=true
  disable_xdg_env_checks=true
  enable_swallow=false
  exit_window_retains_fullscreen=true
  focus_on_activate=false
  force_default_wallpaper=0
  initial_workspace_tracking=0
  key_press_enables_dpms=true
  middle_click_paste=false
  mouse_move_enables_dpms=true
  new_window_takes_over_fullscreen=1
  swallow_exception_regex=.*micro.*
  swallow_regex=(wezterm|foot|kitty|allacritty|Alacritty)
  vfr=true
  vrr=2
}

monitor=HDMI-A-1,2560x1440@144,0x0,1
monitor=DP-1,1920x1080@60,2560x0,1

render {
  direct_scanout=true
}
ecosystem:no_donation_nag=true
ecosystem:no_update_news=true
exec-once=/nix/store/qsqha04lk91d4fnwzxw6g5pkiaazk7dx-start/bin/start
bind = $main, ESCAPE, killactive
# -------------------------- #
